name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

env:
  # ── Non-sensitive config — hardcoded (not secrets) ───────────────────────
  PROJECT_ID: user-info-390317
  REGION: us-central1
  AR_REPO: sample-app
  SERVICE_NAME: sample-app-frontend
  # Docker requires all image names to be strictly lowercase
  IMAGE: us-central1-docker.pkg.dev/user-info-390317/sample-app/frontend

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Authenticate to GCP via Workload Identity Federation ─────────
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ── 3. Authenticate Docker with Artifact Registry ───────────────────
      - name: Login to Artifact Registry
        run: |
          gcloud auth print-access-token \
            | docker login \
                -u oauth2accesstoken \
                --password-stdin \
                https://${{ env.REGION }}-docker.pkg.dev

      # ── 4. Enforce lowercase image name (Docker requirement) ─────────────
      - name: Set lowercase image name
        run: |
          IMAGE_LOWER=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${IMAGE_LOWER}" >> $GITHUB_ENV

      # ── 5. Build Docker image ─────────────────────────────────────────────
      #        VITE_API_BASE_URL is injected at build time so the static
      #        bundle knows the backend Cloud Run URL.
      - name: Build Docker image
        working-directory: frontend
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ secrets.BACKEND_URL }} \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.IMAGE }}:latest" \
            .

      # ── 6. Push Docker image ──────────────────────────────────────────────
      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      # ── 7. Deploy to Cloud Run ────────────────────────────────────────────
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --min-instances=0
            --max-instances=10

      # ── 8. Print deployed URL ─────────────────────────────────────────────
      - name: Show deployed URL
        run: echo "✅ Frontend deployed at ${{ steps.deploy.outputs.url }}"
